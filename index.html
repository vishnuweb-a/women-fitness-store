<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#141414" />
    <!--
      Preload the above-the-fold banner for the route being entered.

      Each of these images is its page's Largest Contentful Paint element, and
      none of them is discoverable from this HTML: they are rendered by React,
      so without a hint the browser only finds them after the stylesheet and
      the entry chunk have parsed.

      Measured against the production preview on a throttled 1.6 Mbps / 150 ms
      profile, median of five runs:

        home        LCP 5292 ms -> 2132 ms  (-60%)
        collection  LCP 3816 ms -> 2404 ms  (-37%)

      This is a script rather than a static `<link>` because the right image
      depends on the route. A single unconditional `<link rel=preload>` for the
      home hero cost the collection pages 512 ms of their own LCP: banner1 was
      fetched there, never used, and its 111 kB competed with the category
      banner that those pages actually paint.

      It is also not a React component. Hoisting a `<link>` from a component
      was measured and does not work for this: by the time React runs, the
      parser-blocking work this is meant to pre-empt has already finished, and
      home LCP stayed at 5252 ms.

      The map is small and static; an unknown route simply preloads nothing.
    -->
    <script>
      (function () {
        var p = location.pathname
        var img =
          p === '/'
            ? 'banner1'
            : p.indexOf('/collections/women-sportswear-clothing') === 0
              ? 'banner3'
              : p.indexOf('/collections/women-sports-equipments') === 0
                ? 'banner5'
                : p.indexOf('/collections/women-sports-accessories') === 0
                  ? 'banner4'
                  : null
        if (!img) return
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/webp'
        l.href = '/assets/banners/' + img + '.webp'
        l.fetchPriority = 'high'
        document.head.appendChild(l)
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The title and the description are rendered per route by
      `src/components/shared/page-meta.jsx`; React 19 hoists them into this
      head when the route mounts.

      Neither is declared here. React *appends* hoisted metadata rather than
      replacing what the document already has, so a static title and
      description left in this file produced two of each on every page. The
      browser resolves `document.title` to React's, but the duplicate still
      ships in the markup and is what a non-executing crawler reads first.

      The cost of leaving them out is that the tab is briefly untitled before
      the bundle executes, and that a client running no JavaScript sees no
      title at all. This build is a client-rendered SPA: such a client sees no
      content either way. Server-side rendering or prerendering is the fix,
      and it is a backend/hosting change rather than a frontend one.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
